<style>
.shooting-stars {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  overflow: hidden;
  z-index: 5;
.shooting-star {
  position: absolute;
  top: 0;
  left: 0;
  width: 8px;
  height: 8px;
  background: #fff;
  border-radius: 50%;
  box-shadow: 0 0 10px 3px rgba(255,255,255,0.9);
  opacity: 0;
  animation: shoot 3s linear infinite;
 }
.shooting-star::before {
  content: "";
  position: absolute;
  top: 50%;
  right: 0;
  width: 120px;
  height: 2px;
  background: red;
  transform: none;
  transform-origin: right center;
}
@keyframes shoot {
  0% { transform: translate(0, 0); opacity: 0; }
  5% { opacity: 1; }
  15% { transform: translate(-250px, 250px); opacity: 1; }
  25% { transform: translate(-300px, 300px); opacity: 0; }
  100% { transform: translate(-300px, 300px); opacity: 0; }
  }
  body { position: relative; }
</head>

<div id="musicControls" style="position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:99999; background:red; width:200px; height:200px; display:flex; gap:10px;">
  <button id="playBtn" style="width:50px; height:50px; border-radius:50%; border:none; background:rgba(255,255,255,0.85); font-size:20px; cursor:pointer;">▶️</button>
  <button id="pauseBtn" style="width:50px; height:50px; border-radius:50%; border:none; background:rgba(255,255,255,0.85); font-size:20px; cursor:pointer;">⏸️</button>
</div>
<script>
  const bgMusic = document.getElementById('bgMusic');
  bgMusic.volume = 0.5;
  document.getElementById('playBtn').addEventListener('click', () => bgMusic.play());
  document.getElementById('pauseBtn').addEventListener('click', () => bgMusic.pause());
</script>
